<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <title>Clairity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-route="today"><span>⌂</span>Today</button>
      <button class="nav-item" data-route="history"><span>▤</span>History</button>
      <button class="nav-item" data-route="insights"><span>⌁</span>Insights</button>
      <button class="nav-item" data-route="settings"><span>⚙</span>Settings</button>
    </nav>

  <script src="app.js"></script>

</html>
