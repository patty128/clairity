<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f1">
  <title>Clairity</title>
  <link rel="stylesheet" href="styles.css?v=1.2.0">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Clairity</p>
        <h1 id="page-title">Today</h1>
        <p id="page-subtitle" class="muted"></p>
      </div>
      <span id="save-status" class="save-status" data-state="saved"><i></i><b>Saved</b></span>
    </header>
    <main id="main-content" class="main-content" tabindex="-1"></main>
    <button id="add-button" class="fab" type="button" aria-label="Add evidence">+</button>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-route="today" type="button"><span class="nav-icon" aria-hidden="true">⌂</span><small>Today</small></button>
      <button class="nav-item" data-route="cycle" type="button"><span class="nav-icon" aria-hidden="true">○</span><small>Cycle</small></button>
      <button class="nav-item" data-route="history" type="button"><span class="nav-icon" aria-hidden="true">▤</span><small>History</small></button>
      <button class="nav-item" data-route="insights" type="button"><span class="nav-icon" aria-hidden="true">⌁</span><small>Insights</small></button>
      <button class="nav-item" data-route="settings" type="button"><span class="nav-icon" aria-hidden="true">⚙</span><small>Settings</small></button>
    </nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=1.2.0"></script>
</body>
</html>
