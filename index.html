<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ee">
  <title>Clairity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Clairity</p>
        <h1 id="page-title">Today</h1>
        <p id="page-subtitle" class="subtitle"></p>
      </div>
      <div id="save-status" class="save-status" data-state="idle" role="status" aria-live="polite" aria-label="Ready">
        <span class="status-spinner" aria-hidden="true"></span>
        <span class="status-check" aria-hidden="true">✓</span>
        <span class="status-error" aria-hidden="true">!</span>
      </div>
    </header>

    <main id="main-content" class="app-content" tabindex="-1"></main>

    <button id="add-button" class="fab" type="button" aria-label="Add evidence">+</button>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" data-route="today" aria-current="page"><span aria-hidden="true">⌂</span><small>Today</small></button>
      <button class="nav-item" type="button" data-route="history"><span aria-hidden="true">▤</span><small>History</small></button>
      <button class="nav-item" type="button" data-route="insights"><span aria-hidden="true">⌁</span><small>Insights</small></button>
      <button class="nav-item" type="button" data-route="settings"><span aria-hidden="true">⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
